<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengabdian Masyarakat</title>
</head>
<body>
    <header>
        <h1>Program Pengabdian Masyarakat</h1>
        <p>Bersama kita membangun lingkungan yang lebih baik</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Pengabdian Masyarakat</a></li>
            <li><a href="kimia.html">Eksperimen Kimia</a></li>
        </ul>
    </nav>

    <main>
        <section id="program">
            <h2>Program Kami</h2>
            <ul>
                <li>Bakti Sosial</li>
                <li>Pendidikan Anak</li>
                <li>Pelatihan Keterampilan</li>
                <li>Lingkungan Bersih</li>
            </ul>
        </section>

        <section id="daftar">
            <h2>Pendaftaran Relawan</h2>
            <form action="#" method="post">
                <label for="nama">Nama Lengkap:</label><br>
                <input type="text" id="nama" name="nama" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="program">Pilih Program:</label><br>
                <select id="program" name="program">
                    <option value="baksos">Bakti Sosial</option>
                    <option value="pendidikan">Pendidikan Anak</option>
                    <option value="pelatihan">Pelatihan Keterampilan</option>
                    <option value="lingkungan">Lingkungan Bersih</option>
                </select><br><br>

                <label for="pesan">Pesan atau Motivasi:</label><br>
                <textarea id="pesan" name="pesan" rows="4" cols="50"></textarea><br><br>

            <a>
                <button href="Experiment.html">Ke Halaman Berikutnya</button>
            </a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pengabdian Masyarakat</p>
    </footer>
</body>
</html>
