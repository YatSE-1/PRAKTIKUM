<!DOCTYPE html>
<html lang="en">
<head>

    <title>Modul 7 (Tugas)_Muhammad Setyadi Hartawan Widyantara_A</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
 
<script> 
 
$(document).ready(function(){ 
 
    $("#btn1").click(function(){ 
 
        alert("Text: " + $("#test").text()); 
 
    }); 
 
    $("#btn2").click(function(){ 
 
        alert("HTML: " + $("#test").html()); 
 
    }); 
 
}); 

</script>

</head>
<body>

    <p id="test"> 
Ini adalah <b>paragraf</b> 
</p> 
 
<button id="btn1">Show Text</button> 
 
<button id="btn2">Show HTML</button>
    
</body>
</html>
