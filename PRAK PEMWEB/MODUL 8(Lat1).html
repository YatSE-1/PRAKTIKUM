<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setya 8 (Latihan 1)</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #shadowing {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 999;
    }

    #box {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
      max-width: 80%;
      max-height: 80%;
    }

    #boxcontent img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #boxtitle {
      text-align: center;
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
  <script>
    function openbox(imgsrc) {
      document.getElementById("shadowing").style.display = "block";
      document.getElementById("box").style.display = "block";
      document.getElementById("boxcontent").innerHTML = "<img src='" + imgsrc + "'>";
      document.getElementById("boxtitle").innerHTML = "Klik gambar untuk menutup";
    }

    function closebox() {
      document.getElementById("shadowing").style.display = "none";
      document.getElementById("box").style.display = "none";
      document.getElementById("boxcontent").innerHTML = "";
      document.getElementById("boxtitle").innerHTML = "";
    }
  </script>
</head>
<body>
  <h1>LIGHTBOX DEMO BY SETYA</h1>
  <p>Dalam demo ini akan menampilkan gambar dalam sebuah kotak yang dibuat secara otomatis begitu gambar diklik</p>
  <br>
  <div id="shadowing" onclick="closebox()"></div>
  <div id="box">
    <div id="boxcontent" onclick="closebox()"></div>
    <div id="boxtitle"></div>
  </div>
  <p>Untuk menampilkan gambar ke dalam kotak lightbox, klik thumbnail gambar di bawah ini...</p>
  <img src="benget bukhori.jpeg" width="150" height="150" onclick="openbox('benget bukhori.jpeg');">
  <img src="Screenshot 2025-12-13 231501.png" width="150" height="150" onclick="openbox('Screenshot 2025-12-13 231501.png');">
  <img src="images/thumb-greenhouse.jpg" width="150" height="150" onclick="openbox('images/greenhouse.jpg');">
  <br>
  <hr>
  <p>(c) 2008 <a href="http://www.xul.fr/en/" target="_parent">Link si xul.fr</a></p>
</body>
</html>
